name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          # Quartz reads git history to date pages, so a shallow clone isn't enough.
          fetch-depth: 0

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # scripts/prepare-images.mjs encodes animated sources to H.264 with ffmpeg. It
      # degrades to an animated WebP without it, which would quietly make the deployed
      # site worse than a local build, so install it rather than rely on the fallback.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Generates responsive stills, videos and animated WebP, then builds. Fails the
      # build on any image without alt text.
      - run: npm run build

      - uses: actions/configure-pages@v5.0.0

      - uses: actions/upload-pages-artifact@v4.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
